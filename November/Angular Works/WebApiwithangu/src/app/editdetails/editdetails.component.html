<h1>
    Edit Details!</h1>
<div>
    <div>
        <label>Name:
            <input [(ngModel)]="employee.empName" placeholder="Name"/>
        </label><br>
        <label>Age:
            <input [(ngModel)]="employee.empAge" placeholder="Age"/>
        </label><br>
        <label>Salary:
            <input [(ngModel)]="employee.empSalary" placeholder="Mark"/>
        </label><br>
        <label>Addressk:
            <input [(ngModel)]="employee.empAddr" placeholder="Mark"/>
        </label><br>
    </div>
    <button (click)="updateEmp()">Update</button>
    <button routerLink="/AllDetails/">        Goto Home        </button>
</div>
